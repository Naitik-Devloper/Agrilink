<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriLink - Fleet Assets</title>

    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-green: #2e7d32;
            --dark-bg: #1b5e20;
            --light-green: #e8f5e9;
            --bg-body: #f4f6f4;
            --text-dark: #333333;
        }

        body {
            background-color: var(--bg-body) !important;
            color: var(--text-dark) !important;
        }

        .sb {
            background-color: #1C3F24 !important;
        }

        /* Desktop layout structural alignment wrapper */
        @media (min-width: 992px) {
            .main-content-wrapper {
                margin-left: 260px !important;
                padding: 30px !important;
                margin-top: 56px;
            }
        }

        /* Mobile dynamic screen updates */
        @media (max-width: 991.98px) {
            .main-content-wrapper {
                margin-left: 0px !important;
                padding: 15px !important;
                margin-top: 56px;
            }
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-menu li a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            display: block;
            transition: all 0.3s ease;
        }

        .sidebar-menu li a:hover,
        .sidebar-menu li.active a {
            background-color: var(--primary-green);
            color: #ffffff;
            font-weight: 600;
        }

        .text-agri {
            color: var(--primary-green) !important;
        }
    </style>
</head>

<body>

    <!-- Fixed Top Navbar Component -->
    <nav class="navbar navbar-expand-lg bg-dark fixed-top navbar-dark">
        <div class="container-fluid px-3 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-success d-lg-none me-2" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mySidebar" aria-controls="mySidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a class="navbar-brand fw-bold text-success fs-3 d-flex align-items-center gap-2 m-0" href="#">
                    <i class="fa-brands fa-pagelines"></i> AgriLink
                </a>
            </div>

        </div>
    </nav>

    <!-- Sidebar Navigation Drawer -->
    <div class="offcanvas-lg offcanvas-start text-white border-end border-secondary p-4 shadow sb" id="mySidebar"
        style="width: 260px; min-height: 100vh; position: fixed; left: 0; z-index: 1000; top: 56px;">
        <div class="text-center">
            <div class="d-grid gap-2 text-start">
                <ul class="sidebar-menu p-0">
                    <li><a href="L_Dashboard.html">Dashboard</a></li>
                    <li><a href="all_fleet.html">Drivers</a></li>
                    <li><a href="L_Add_Driver.html">Add New Drivers</a></li>
                    <li><a href="L_Dashboard_WA.html">Work Assigment</a></li>
                    <li><a href="L_Feedback.html">Feedback</a></li>
                </ul>
            </div>
        </div>
    </div>
    <!-- Main Workspace Frame Container -->
    <div class="main-content-wrapper flex-grow-1 mt-5">
        <div class="container-fluid mt-5">

            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-header bg-success text-white text-center">
                            <h3>AgriLink Feedback Form</h3>
                            <p class="mb-0">Your feedback helps us improve our services.</p>
                        </div>

                        <div class="card-body">

                            <form>

                                <!-- User Type -->
                                <div class="mb-3">
                                    <label class="form-label fw-bold">
                                        Select User Type
                                    </label>
                                    <select class="form-select" required>
                                        <option selected disabled>Select User Type</option>
                                        <option value="Farmer">👨‍🌾 Farmer</option>
                                        <option value="Buyer">🛒 Buyer</option>
                                    </select>
                                </div>

                                <!-- Name -->
                                <div class="mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" placeholder="Enter your name">
                                </div>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" placeholder="Enter your email">
                                </div>

                                <!-- Rating -->
                                <div class="mb-3">
                                    <label class="form-label">Rating</label>
                                    <select class="form-select">
                                        <option>⭐⭐⭐⭐⭐ Excellent</option>
                                        <option>⭐⭐⭐⭐ Good</option>
                                        <option>⭐⭐⭐ Average</option>
                                        <option>⭐⭐ Poor</option>
                                        <option>⭐ Very Poor</option>
                                    </select>
                                </div>

                                <!-- Feedback -->
                                <div class="mb-3">
                                    <label class="form-label">Feedback</label>
                                    <textarea class="form-control" rows="5"
                                        placeholder="Write your feedback..."></textarea>
                                </div>

                                <div class="d-flex justify-content-center mt-3">
                                    <button type="submit" class="btn btn-success px-5">
                                        Submit Feedback
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>


        </div>





    </div> <!-- End Grid Row -->

    </div>
    </div>

    <!-- Bootstrap 5 Compiled Bundle JS Component (Required for running dropdown actions) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
